<link rel="stylesheet" href="styles/header.css">
<link rel="stylesheet" href="styles/404.css">
<link rel="stylesheet" href="styles/footer.css">
</head>
<body>
  <div id="global-header"></div>

  <main>
    <section class="phero">
      <div class="grid-tex"></div><div class="glow"></div><div class="wedge"></div>
      <div class="wrap">
        <div class="error-code reveal">404</div>
        <h1 class="reveal d1">This page couldn’t be found.</h1>
        <p class="lead reveal d2">The page you’re looking for may have moved or no longer exists. Let’s get you back on track.</p>
        <div class="error-actions reveal d3">
          <a href="index.html" class="btn btn-primary">Back to home<span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
          <a href="platform.html" class="btn btn-ghost">Explore the platform<span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>

  <script>
    async function loadGlobalHeader(){
      const container=document.getElementById('global-header');
      const response=await fetch('components/header.html');
      container.innerHTML=await response.text();
      const hdr=document.getElementById('hdr');
      const setHeaderState=()=>hdr.classList.toggle('scrolled',scrollY>30);
      setHeaderState();addEventListener('scroll',setHeaderState);
      const mb=document.getElementById('menuBtn'),nl=document.getElementById('navlinks');
      mb&&mb.addEventListener('click',()=>nl.classList.toggle('open'));
      nl.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>nl.classList.remove('open')));
    }
    async function loadGlobalFooter(){
      const container=document.getElementById('global-footer');
      const response=await fetch('components/footer.html');
      container.innerHTML=await response.text();
    }
    loadGlobalHeader();loadGlobalFooter();
    const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  </script>
</body>
</html>
