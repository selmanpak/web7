<body id="top">
  <div id="global-header"></div>

  <main class="hero">
    <div class="hero-bg">
      <div class="grid-tex"></div>
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="wedge"></div>
    </div>
    <div class="wrap">
      <section>
        <div class="eyebrow">FirstData</div>
        <h1>The future of asset ownership, <span class="accent">tokenized.</span></h1>
        <p class="sub">Regulated, AI-integrated infrastructure for real-world asset tokenization.</p>
      </section>
      <section class="hero-mark" aria-hidden="true">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <img class="bigmark" src="assets/icon-512.png" alt="">
      </section>
    </div>
  </main>

  <div id="global-footer"></div>

  <script>
    async function loadGlobalHeader() {
      const container = document.getElementById('global-header');
      const response = await fetch('/web7/components/header.html');
      container.innerHTML = await response.text();

      const header = document.getElementById('hdr');
      const menuBtn = document.getElementById('menuBtn');
      const navLinks = document.getElementById('navlinks');

      const onScroll = () => {
        header.classList.toggle('scrolled', window.scrollY > 20);
      };

      onScroll();
      window.addEventListener('scroll', onScroll);

      menuBtn?.addEventListener('click', () => {
        navLinks?.classList.toggle('open');
      });
    }

    async function loadGlobalFooter() {
      const container = document.getElementById('global-footer');
      const response = await fetch('/web7/components/footer.html');
      container.innerHTML = await response.text();
    }

    loadGlobalHeader();
    loadGlobalFooter();
  </script>
