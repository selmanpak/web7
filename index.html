<style>
  :root{
    --green:#00B583;
    --green-bright:#16e3a6;
    --deep-green:#00291D;
    --deep-green-2:#063528;
    --black:#000000;
    --bg:#050807;
    --bg-soft:#0a1310;
    --panel:#0c1714;
    --panel-2:#0f1d18;
    --gray:#6B6C6C;
    --white:#ffffff;
    --muted:rgba(255,255,255,.62);
    --muted-2:rgba(255,255,255,.40);
    --line:rgba(0,181,131,.18);
    --line-soft:rgba(255,255,255,.07);
    --maxw:1200px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',Arial,sans-serif;
    background:var(--bg);
    color:var(--white);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--green);color:#00150e}

  /* ---------- shared ---------- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--green);margin-bottom:22px;
  }
  .eyebrow::before{content:"";width:30px;height:3px;background:var(--green);border-radius:2px}
  h1,h2,h3{font-weight:800;line-height:1.08;letter-spacing:-.02em}
  .section{padding:120px 0;position:relative}
  .section h2{font-size:clamp(30px,4.4vw,52px);text-transform:uppercase}
  .section .lead{color:var(--muted);font-size:18px;max-width:620px;margin-top:18px}
  .green{color:var(--green)}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;gap:14px;
    font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    padding:15px 16px 15px 26px;border-radius:60px;cursor:pointer;border:none;
    transition:.35s var(--ease);
  }
  .btn .circ{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    transition:.35s var(--ease);
  }
  .btn .circ svg{width:15px;height:15px}
  .btn-primary{background:var(--green);color:#00150e}
  .btn-primary .circ{background:#00150e;color:var(--green)}
  .btn-primary:hover{background:var(--green-bright);transform:translateY(-2px);box-shadow:0 14px 40px -12px var(--green)}
  .btn-primary:hover .circ{transform:rotate(-45deg)}
  .btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--line-soft);padding-left:24px}
  .btn-ghost .circ{background:rgba(0,181,131,.16);color:var(--green)}
  .btn-ghost:hover{border-color:var(--green);background:rgba(0,181,131,.08)}

  /* logo */
  .logo{display:flex;align-items:center}
  .fdlogo{height:25px;width:auto;display:block;transition:.3s}
  footer .fdlogo{height:30px}
  header.scrolled .fdlogo{height:23px}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:20px 0;transition:.4s var(--ease);
    border-bottom:1px solid transparent;
  }
  header.scrolled{
    background:rgba(5,8,7,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);padding:13px 0;
  }
  .nav{display:flex;align-items:center;justify-content:space-between}
  .nav-links{display:flex;align-items:center;gap:38px;list-style:none}
  .nav-links a{font-size:14px;font-weight:500;color:var(--muted);transition:.25s;position:relative}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--green);transition:.3s var(--ease)}
  .nav-links a:hover{color:#fff}.nav-links a:hover::after{width:100%}
  .nav-cta{display:flex;align-items:center;gap:18px}
  .menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;flex-direction:column;gap:5px}
  .menu-btn span{width:24px;height:2px;background:#fff;border-radius:2px;transition:.3s}

  /* ---------- hero ---------- */
  .hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:140px 0 80px;overflow:hidden}
  .hero-bg{position:absolute;inset:0;z-index:0}
  .grid-tex{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 0%,transparent 75%)}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
  .glow.g1{width:620px;height:620px;background:radial-gradient(circle,rgba(0,181,131,.55),transparent 65%);top:-120px;right:-60px}
  .glow.g2{width:520px;height:520px;background:radial-gradient(circle,rgba(0,41,29,.9),transparent 70%);bottom:-160px;left:-120px;opacity:.9}
  .wedge{position:absolute;top:0;right:0;width:46%;height:100%;
    background:linear-gradient(150deg,var(--deep-green) 0%,rgba(0,41,29,0) 75%);
    clip-path:polygon(28% 0,100% 0,100% 100%,0% 100%);opacity:.55;z-index:0}
  .hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;width:100%}
  .hero h1{font-size:clamp(38px,6vw,76px);text-transform:none}
  .hero h1 .accent{color:var(--green);display:inline-block}
  .hero p.sub{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:540px;margin:26px 0 38px;line-height:1.7}
  .hero-ctas{display:flex;gap:16px;flex-wrap:wrap}
  .hero-mark{position:relative;display:grid;place-items:center;min-height:360px}
  .hero-mark .ring{position:absolute;border:1px solid var(--line);border-radius:50%}
  .hero-mark .ring.r1{width:340px;height:340px;animation:spin 26s linear infinite}
  .hero-mark .ring.r2{width:250px;height:250px;border-style:dashed;border-color:rgba(0,181,131,.28);animation:spin 18s linear infinite reverse}
  .hero-mark .bigmark{width:auto;height:172px;filter:drop-shadow(0 18px 50px rgba(0,181,131,.55));animation:float 6s ease-in-out infinite}
  .hero-mark .dot{position:absolute;width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 16px var(--green)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
  /* hero asset cards (Option A) */
  .hero-cards{position:relative;display:flex;flex-direction:column;gap:14px}
  .acard{background:rgba(10,28,22,.78);border:1px solid rgba(0,181,131,.22);border-radius:18px;padding:22px 24px;backdrop-filter:blur(10px);transition:.4s var(--ease)}
  .acard:hover{border-color:rgba(0,181,131,.55);transform:translateX(-6px)}
  .hero-cards .acard:nth-child(1){animation:fc1 6s ease-in-out infinite}
  .hero-cards .acard:nth-child(2){animation:fc2 6s ease-in-out infinite}
  .hero-cards .acard:nth-child(3){animation:fc3 6s ease-in-out infinite}
  @keyframes fc1{0%,100%{transform:translateY(-8px)}50%{transform:translateY(4px)}}
  @keyframes fc2{0%,100%{transform:translateY(4px)}50%{transform:translateY(-6px)}}
  @keyframes fc3{0%,100%{transform:translateY(-2px)}50%{transform:translateY(8px)}}
  .ac-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .ac-ic{width:40px;height:40px;border-radius:10px;background:rgba(0,181,131,.14);display:grid;place-items:center;color:var(--green)}
  .ac-ic svg{width:19px;height:19px}
  .ac-badge{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);background:rgba(0,181,131,.12);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
  .ac-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:acpulse 2s infinite}
  @keyframes acpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .ac-type{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
  .ac-name{font-size:17px;font-weight:700;margin-bottom:14px}
  .ac-stats{display:flex;gap:18px}
  .ac-s .v{font-size:18px;font-weight:800;color:var(--white)}.ac-s .l{font-size:11px;color:var(--muted-2);margin-top:2px}
  .ac-s .v.grn{color:var(--green)}
  .ac-note{text-align:right;font-size:11px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .scroll-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:10px}
  .scroll-hint .bar{width:1px;height:42px;background:linear-gradient(var(--green),transparent);animation:drop 2s var(--ease) infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* ---------- trust strip ---------- */
  .trust{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--bg-soft);padding:40px 0}
  .trust .label{text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-2);margin-bottom:26px}
  .trust-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
  .chip{display:flex;align-items:center;gap:10px;padding:11px 20px;border:1px solid var(--line-soft);border-radius:50px;font-size:13.5px;color:var(--muted);transition:.3s}
  .chip:hover{border-color:var(--green);color:#fff}
  .chip .d{width:7px;height:7px;border-radius:50%;background:var(--green)}

  /* ---------- pillars ---------- */
  .pillars-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:60px}
  .pcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:18px;padding:30px 26px;transition:.4s var(--ease);position:relative;overflow:hidden}
  .pcard::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:.4s var(--ease)}
  .pcard:hover{transform:translateY(-6px);border-color:var(--line);background:var(--panel-2)}
  .pcard:hover::before{transform:scaleX(1)}
  .pcard .ic{width:50px;height:50px;border-radius:13px;background:rgba(0,181,131,.12);display:grid;place-items:center;color:var(--green);margin-bottom:22px}
  .pcard .ic svg{width:24px;height:24px}
  .pcard h3{font-size:18px;margin-bottom:10px}
  .pcard p{font-size:14.5px;color:var(--muted)}

  /* ---------- lifecycle ---------- */
  .flow{margin-top:64px;position:relative}
  .flow-line{position:absolute;top:32px;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .flow-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative}
  .fstep{text-align:center;padding:0 6px}
  .fstep .num{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--green);font-weight:800;font-size:20px;position:relative;transition:.4s var(--ease)}
  .fstep:hover .num{background:var(--green);color:#00150e;box-shadow:0 0 28px -4px var(--green)}
  .fstep h4{font-size:14.5px;margin-bottom:7px;font-weight:700}
  .fstep p{font-size:12.5px;color:var(--muted-2);line-height:1.5}

  /* ---------- solutions ---------- */
  .sol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:60px}
  .scard{border:1px solid var(--line-soft);border-radius:20px;padding:38px 32px;background:linear-gradient(180deg,var(--panel),var(--bg-soft));transition:.4s var(--ease);position:relative}
  .scard:hover{transform:translateY(-6px);border-color:var(--green)}
  .scard .tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:700}
  .scard h3{font-size:23px;margin:14px 0 16px}
  .scard ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .scard li{display:flex;gap:11px;font-size:14.5px;color:var(--muted)}
  .scard li svg{width:18px;height:18px;color:var(--green);flex:0 0 auto;margin-top:3px}

  /* ---------- why ---------- */
  .why{background:var(--bg-soft);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:60px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden}
  .wcell{background:var(--bg);padding:34px 30px;transition:.35s}
  .wcell:hover{background:var(--panel-2)}
  .wcell .n{font-size:13px;color:var(--green);font-weight:800;letter-spacing:.1em}
  .wcell h4{font-size:18px;margin:14px 0 10px}
  .wcell p{font-size:14px;color:var(--muted)}

  /* ---------- stats band ---------- */
  .stats{background:linear-gradient(120deg,var(--deep-green),#00150e 70%);position:relative;overflow:hidden}
  .stats::before{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(0,181,131,.3),transparent 65%);filter:blur(60px);top:-160px;right:-80px}
  .stats .wrap{position:relative;z-index:2}
  .stats h2{font-size:clamp(26px,3.4vw,40px)}
  .stats .lead{margin-bottom:54px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
  .stat{border-left:2px solid var(--green);padding-left:24px}
  .stat .big{font-size:clamp(40px,5.6vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1}
  .stat .big .green{margin-left:2px}
  .stat .cap{font-size:14px;color:var(--muted);margin-top:12px;max-width:240px}
  .stats .src{font-size:11px;color:var(--muted-2);margin-top:40px}

  /* ---------- infra (trust teaser) ---------- */
  .infra{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
  .infra .panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:42px}
  .infra .chain{display:flex;flex-direction:column;gap:0}
  .clink{display:flex;align-items:center;gap:16px;padding:16px 0}
  .clink .ico{width:42px;height:42px;border-radius:11px;background:rgba(0,181,131,.12);color:var(--green);display:grid;place-items:center;flex:0 0 auto}
  .clink .ico svg{width:20px;height:20px}
  .clink .tx b{display:block;font-size:15px}.clink .tx span{font-size:13px;color:var(--muted-2)}
  .clink:not(:last-child){border-bottom:1px dashed var(--line-soft)}
  .infra h2{font-size:clamp(28px,3.6vw,44px);text-transform:uppercase}
  .infra .tagbig{font-size:22px;font-weight:800;color:var(--green);margin:24px 0 14px}
  .infra p{color:var(--muted);font-size:15.5px}

  /* ---------- cta band ---------- */
  .cta{text-align:center;background:var(--bg-soft);position:relative;overflow:hidden}
  .cta .glow{width:600px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,181,131,.28),transparent 65%);filter:blur(70px);top:0;left:50%;transform:translateX(-50%);opacity:.7}
  .cta .wrap{position:relative;z-index:2}
  .cta h2{font-size:clamp(32px,5vw,60px);text-transform:none;max-width:760px;margin:0 auto}
  .cta p{color:var(--muted);font-size:18px;margin:22px auto 38px;max-width:520px}

  /* ---------- footer ---------- */
  footer{background:var(--black);border-top:1px solid var(--line-soft);padding:72px 0 34px}
  .f-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px;padding-bottom:48px;border-bottom:1px solid var(--line-soft)}
  .f-brand p{color:var(--muted);font-size:14px;margin-top:18px;max-width:280px}
  .f-slogan{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-top:22px;font-weight:700}
  .f-col h5{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:18px}
  .f-col ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .f-col a{font-size:14px;color:var(--muted);transition:.25s}.f-col a:hover{color:var(--green)}
  .f-contact div{font-size:14px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px}
  .f-contact svg{width:17px;height:17px;color:var(--green);flex:0 0 auto;margin-top:3px}
  .f-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:26px;flex-wrap:wrap;gap:14px}
  .f-bottom span{font-size:13px;color:var(--muted-2)}
  .f-bottom .links{display:flex;gap:24px}
  .f-bottom .links a{font-size:13px;color:var(--muted-2)}.f-bottom .links a:hover{color:var(--green)}

  /* reveal */
  .reveal{opacity:0;transform:translateY(28px);transition:.8s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

  /* ---------- responsive ---------- */
  @media(max-width:980px){
    .pillars-grid{grid-template-columns:repeat(2,1fr)}
    .flow-steps{grid-template-columns:repeat(3,1fr);gap:30px 10px}
    .flow-line{display:none}
    .sol-grid{grid-template-columns:1fr}
    .why-grid{grid-template-columns:1fr}
    .infra{grid-template-columns:1fr;gap:36px}
    .stat-grid{grid-template-columns:1fr;gap:34px}
    .f-top{grid-template-columns:1fr 1fr}
    .hero .wrap{grid-template-columns:1fr}
    .hero-cards{margin-top:6px}
  }
  @media(max-width:680px){
    .nav-links,.nav-cta .btn{display:none}
    .menu-btn{display:flex}
    .nav-links.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:rgba(5,8,7,.97);backdrop-filter:blur(14px);padding:24px 28px;gap:22px;border-bottom:1px solid var(--line-soft)}
    .section{padding:84px 0}
    .pillars-grid{grid-template-columns:1fr}
    .flow-steps{grid-template-columns:1fr;gap:22px}
    .f-top{grid-template-columns:1fr}
    .wrap{padding:0 20px}
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="hero-bg">
      <div class="grid-tex"></div>
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="wedge"></div>
    </div>
    <div class="wrap">
      <section>
